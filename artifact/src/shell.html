<title>ACIA Spec Sheet Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: navy masthead, then a two-pane workspace (editor | live PDF) that stacks on narrow screens. */
/* Layout: ACIA Commercial's page pattern - a navy cover with the title, a strip of figures riding its lower
   edge, then sections of white panels. Tokens use the site's names, so framed in the site they line up exactly. */
:root {
  --navy: #003087; --navy-deep: #001A52; --sky: #2FB6FF; --pop: #2FB6FF;
  --primary: #1652E0; --primary-hover: #0D3FBF; --accent: #1652E0; --accent-soft: #E6EEFF; --accent-text: #003087;
  --bg: #F3F6FB; --surface: #FFFFFF; --surface-alt: #EDF2FA; --surface-hover: #F5F8FE;
  --ink: #0A1633; --ink-soft: #46536D; --ink-faint: #5F6B84; --border: #D9E2F0; --grid: #E6ECF5; --bar-track: #E8EEF7;
  --good: #00995C; --good-bg: #DBF5EA; --good-text: #007A49; --warn: #B86E00; --warn-bg: #FFF1D9; --warn-text: #8F5500;
  --critical: #D92D20; --critical-bg: #FDE7E5; --critical-text: #B42318; --dk-hi: #7FD3FF; --dk-ink-2: #AAC2EE;
  --shadow-sm: 0 1px 2px rgba(10,22,51,.06), 0 1px 1px rgba(10,22,51,.04);
  --shadow-lg: 0 2px 6px rgba(10,22,51,.06), 0 16px 36px rgba(10,22,51,.12);
  --hero: radial-gradient(760px 360px at 88% -24%, rgba(47,182,255,.36), transparent 62%), radial-gradient(680px 300px at 6% 130%, rgba(22,82,224,.5), transparent 62%), linear-gradient(135deg, #001A52 0%, #003087 52%, #0B44B5 100%);
  --radius: 12px; --shell: 1320px;
  /* the builder's own names, mapped onto the site's */
  --fg: var(--ink); --muted: var(--ink-soft); --line: var(--border); --line-strong: #C3CFE3; --heading: var(--ink);
  --accent-2: var(--primary); --accent-fg: #FFFFFF; --field-hover: var(--surface-hover); --surface-2: var(--surface-alt);
  --hl: #FFF3C4; --hl-fg: #5C4500; --ok: var(--good-text); --danger: var(--critical); --warn-line: #F1D59B; --warn-fg: var(--warn-text);
  --mast: var(--navy); --mast-fg: #FFFFFF;
  --display: "Archivo", Inter, Arial, sans-serif;
  --body: "Archivo", Inter, "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --primary: #2563EB; --primary-hover: #3D7BFF; --accent: #4D8DFF; --accent-soft: #12254A; --accent-text: #9CC2FF;
  --bg: #060C18; --surface: #0D1526; --surface-alt: #131D33; --surface-hover: #111B2F;
  --ink: #E8EEF8; --ink-soft: #A9B5CB; --ink-faint: #7E8BA3; --border: #1F2B44; --grid: #18233A; --bar-track: #18233A;
  --good: #2BD98A; --good-bg: #0B2E20; --good-text: #2BD98A; --warn: #FFB547; --warn-bg: #33240A; --warn-text: #FFB547;
  --critical: #FF6B5E; --critical-bg: #3D1410; --critical-text: #FF6B5E;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.45); --shadow-lg: 0 8px 30px rgba(0,0,0,.5);
  --hero: radial-gradient(760px 360px at 88% -24%, rgba(47,182,255,.24), transparent 62%), radial-gradient(680px 300px at 6% 130%, rgba(22,82,224,.35), transparent 62%), linear-gradient(135deg, #000F33 0%, #001A52 55%, #003087 100%);
  --line-strong: #2A3A5C; --hl: #4A3D0D; --hl-fg: #FFE9A6; --warn-line: #5C4A1A; --mast: #001A52; color-scheme: dark; } }
:root[data-theme="dark"] {
  --primary: #2563EB; --primary-hover: #3D7BFF; --accent: #4D8DFF; --accent-soft: #12254A; --accent-text: #9CC2FF;
  --bg: #060C18; --surface: #0D1526; --surface-alt: #131D33; --surface-hover: #111B2F;
  --ink: #E8EEF8; --ink-soft: #A9B5CB; --ink-faint: #7E8BA3; --border: #1F2B44; --grid: #18233A; --bar-track: #18233A;
  --good: #2BD98A; --good-bg: #0B2E20; --good-text: #2BD98A; --warn: #FFB547; --warn-bg: #33240A; --warn-text: #FFB547;
  --critical: #FF6B5E; --critical-bg: #3D1410; --critical-text: #FF6B5E;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.45); --shadow-lg: 0 8px 30px rgba(0,0,0,.5);
  --hero: radial-gradient(760px 360px at 88% -24%, rgba(47,182,255,.24), transparent 62%), radial-gradient(680px 300px at 6% 130%, rgba(22,82,224,.35), transparent 62%), linear-gradient(135deg, #000F33 0%, #001A52 55%, #003087 100%);
  --line-strong: #2A3A5C; --hl: #4A3D0D; --hl-fg: #FFE9A6; --warn-line: #5C4A1A; --mast: #001A52; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font: 400 14px/1.45 var(--body); font-variation-settings: "wdth" 100; color: var(--fg); min-height: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--mast); }
/* ACIA website type: Archivo; headings 600 at wdth 112, feature names 700 at wdth 125 (used sparingly). */
h1, h2, h3 { font-family: var(--display); font-weight: 600; font-variation-settings: "wdth" 112; color: var(--heading); text-wrap: balance; margin: 0; }
body { background: var(--bg); }
h1 { font-size: 26px; }
h2 { font-size: 18px; }
.feature-name { font-weight: 700; font-variation-settings: "wdth" 125; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.mast { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--mast); color: var(--mast-fg); }
.mast .inner { display: flex; align-items: center; gap: 16px; height: 54px; max-width: 1640px; margin: 0 auto; }
.mast img { height: 24px; display: block; }
.mast .app { font-family: var(--display); font-weight: 600; font-variation-settings: "wdth" 112; font-size: 17px; padding-left: 16px; border-left: 1px solid rgba(255,255,255,.3); letter-spacing: .02em; }
.mast nav { margin-left: auto; display: flex; gap: 4px; }
.mast nav a { color: var(--mast-fg); text-decoration: none; padding: 6px 12px; border-radius: 4px; opacity: .8; font-weight: 500; }
.mast nav a[aria-current="page"], .mast nav a:hover { opacity: 1; background: rgba(255,255,255,.12); }

main { padding-block: 0 64px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.mono { font-family: var(--mono); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--ink);
  font-size: .8rem; line-height: 1.3; padding: 7px 13px; border-radius: 9px; font-weight: 500; white-space: nowrap; cursor: pointer; text-decoration: none; }
.btn:hover { background: var(--surface-alt); }
.btn.primary, .btn.sky { background: var(--primary); border-color: var(--primary); color: #FFFFFF; font-weight: 600; }
.btn.primary:hover, .btn.sky:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn.ghost { border-color: transparent; background: none; color: var(--ink-soft); padding: 4px 7px; }
.btn.ghost:hover { color: var(--ink); background: var(--surface-alt); }
.btn.light { background: #FFFFFF; color: var(--navy); border-color: #FFFFFF; font-weight: 600; padding: 9px 16px; }
.btn.light:hover { background: #E9F0FD; }
.btn.glass { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.28); color: #FFFFFF; padding: 9px 15px; }
.btn.glass:hover { background: rgba(255,255,255,.2); }
.btn.danger { color: var(--critical-text); }
.btn:disabled { opacity: .5; cursor: default; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.chip.dirty { background: var(--hl); color: var(--hl-fg); }
.chip.ok { color: var(--ok); }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 15px 19px 10px; flex-wrap: wrap; }
.panel-head h3 { font-size: .98rem; }
.panel-head .hint { font-size: .76rem; color: var(--ink-faint); }

/* the site's page parts: cover, figures strip, sections */
.shell { width: 100%; max-width: var(--shell); margin: 0 auto; padding-inline: 28px; }
.cover { background: var(--hero); color: #FFFFFF; padding-block: 40px 100px; position: relative; overflow: hidden; }
.cover::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
  background-size: 44px 44px; -webkit-mask-image: radial-gradient(120% 90% at 78% 10%, #000 20%, transparent 72%); mask-image: radial-gradient(120% 90% at 78% 10%, #000 20%, transparent 72%); }
.cover.compact { padding-block: 30px 34px; }
.cover.compact .cover-grid { align-items: start; }
.cover .shell { position: relative; z-index: 1; }
.cover :focus-visible { outline-color: #FFFFFF; }
.cover-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 44px; align-items: end; }
.eyebrow-line { font-size: .72rem; text-transform: uppercase; letter-spacing: .15em; color: var(--dk-hi); font-weight: 600; margin: 0 0 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.cv-top { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; margin: 0 0 12px; }
.cv-top .eyebrow-line { margin: 0; }
.cv-back { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 13px 4px 9px; border-radius: 999px;
  border: 1px solid rgba(230,238,255,.28); background: rgba(230,238,255,.08); color: #E6EEFF; font: 600 .76rem var(--body); cursor: pointer; }
.cv-back svg { width: 15px; height: 15px; flex: none; }
.cv-back:hover { background: rgba(230,238,255,.16); }
.cv-back:focus-visible { outline: 2px solid var(--dk-hi); outline-offset: 2px; }
.eyebrow-line .crumb { background: none; border: 0; padding: 0; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.cover h1 { font-family: var(--display); font-size: 2.6rem; letter-spacing: -.035em; font-weight: 800; line-height: 1.08; color: #FFFFFF; max-width: 24ch; font-variation-settings: "wdth" 100; }
.cover h1 .t-sub { display: block; font-size: .5em; font-weight: 500; letter-spacing: 0; color: #BCD0F2; margin-top: 6px; }
.lede { margin: 14px 0 0; max-width: 66ch; font-size: 1.04rem; color: #CCDAF2; line-height: 1.55; }
.lede b { color: #FFFFFF; font-weight: 600; }
.cover-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 22px; }
.side { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); border-radius: 16px; padding: 16px 18px; backdrop-filter: blur(8px); min-width: 0; }
.side-h { font-size: .68rem; text-transform: uppercase; letter-spacing: .12em; color: var(--dk-hi); font-weight: 700; margin-bottom: 10px; }
.side-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 0; border: 0; border-top: 1px solid rgba(255,255,255,.12);
  font: inherit; font-size: .84rem; color: #FFFFFF; background: none; width: 100%; text-align: left; cursor: pointer; }
.side-row:first-of-type { border-top: 0; }
.side-row:hover span { text-decoration: underline; }
.side-row small { display: block; color: var(--dk-ink-2); font-size: .72rem; }
.side-row b { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.side-row b small { text-align: right; font-weight: 500; }
.side-row b.warn { color: #FFD27A; } .side-row b.crit { color: #FF9A90; } .side-row b.good { color: #7FE6B3; }
.side-empty { font-size: .82rem; color: #B9CDF0; }
.kpis { display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
  box-shadow: var(--shadow-lg); margin-top: -62px; position: relative; z-index: 2; overflow: hidden; }
.kpi { padding: 19px 21px 17px; display: flex; flex-direction: column; gap: 4px; min-width: 0; text-align: left; border: 0; background: none; color: inherit; font: inherit; }
.kpi + .kpi { border-left: 1px solid var(--grid); }
.kpi .l { font-size: .64rem; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-faint); font-weight: 700; }
.kpi .v { font-size: 1.85rem; font-weight: 700; letter-spacing: -.035em; color: var(--accent-text); line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: .76rem; color: var(--ink-soft); }
.kpi.good .v { color: var(--good-text); } .kpi.warn .v { color: var(--warn-text); } .kpi.crit .v { color: var(--critical-text); }
.kbar { position: relative; display: block; height: 4px; margin-top: 8px; border-radius: 999px; background: var(--bar-track); overflow: hidden; }
.kbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--primary); }
.kbar.good i { background: var(--good); } .kbar.warn i { background: var(--warn); }
.psec { padding-top: 28px; }
.psec-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px 28px; flex-wrap: wrap; margin-bottom: 16px; }
.psec-head > div { max-width: 780px; min-width: 0; }
.psec-head h2 { font-size: 1.42rem; letter-spacing: -.02em; line-height: 1.2; color: var(--ink); }
.psec-head p { margin: 6px 0 0; color: var(--ink-soft); font-size: .92rem; line-height: 1.5; }
.eyebrow { display: block; font-size: .66rem; text-transform: uppercase; letter-spacing: .14em; color: var(--accent); font-weight: 700; margin-bottom: 6px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: .69rem; font-weight: 600; line-height: 1.5; white-space: nowrap;
  background: var(--surface-alt); color: var(--ink-soft); border: 1px solid transparent; }
.pill.good { background: var(--good-bg); color: var(--good-text); } .pill.warn { background: var(--warn-bg); color: var(--warn-text); }
.pill.crit { background: var(--critical-bg); color: var(--critical-text); } .pill.acc { background: var(--accent-soft); color: var(--accent-text); }
.pill.on-dark { background: rgba(255,255,255,.14); color: #FFFFFF; vertical-align: 4px; margin-left: 8px; font-size: .72rem; letter-spacing: 0; }
.pill.on-dark.warn { background: rgba(255,181,71,.22); color: #FFD27A; }
.pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; display: inline-block; }
.pad { padding: 16px; }
.input, .ta { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 5px; padding: 6px 8px; }
.ta { resize: vertical; min-height: 60px; }
.field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }

/* Fleet */
.drop { border: 1.5px dashed var(--line-strong); border-radius: var(--radius); background: var(--surface); padding: 18px 20px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 18px; }
.drop.over { border-color: var(--primary); background: var(--accent-soft); }
.drop .glyph { font-size: .66rem; font-weight: 700; letter-spacing: .1em; color: var(--accent); border: 1px solid var(--accent); border-radius: 8px; padding: 9px 8px; line-height: 1.3; text-align: center; }
.fleet { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.tail { text-align: left; cursor: pointer; padding: 0; overflow: hidden; display: flex; flex-direction: column; border: 1px solid var(--border); background: var(--surface);
  border-radius: var(--radius); box-shadow: var(--shadow-sm); font: inherit; color: inherit; }
.tail:hover { border-color: var(--primary); box-shadow: var(--shadow-lg); }
.tail .top { padding: 15px 18px 10px; display: flex; align-items: baseline; gap: 10px; border-bottom: 1px solid var(--grid); }
.tail .top > span:first-child { white-space: nowrap; }
.tail .model { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.tail .kind { font-size: .64rem; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-faint); font-weight: 700; }
.tail .msn { font-family: var(--display); font-size: 1.7rem; letter-spacing: -.03em; line-height: 1; color: var(--accent-text); font-weight: 700; }
.tail .model { font-size: .9rem; color: var(--ink-soft); white-space: nowrap; }
.tail .reg { white-space: nowrap; margin-left: auto; }
.tail dl { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; margin: 0; padding: 12px 18px 16px; font-size: .84rem; }
.tail dt { color: var(--ink-faint); }
.tail dd { margin: 0; min-width: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.empty { padding: 36px 20px; text-align: center; color: var(--muted); }

/* Workspace */
.ws-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.ws-head .title { margin-right: auto; min-width: 0; }
.ws-head h1 span { font-weight: 500; color: var(--muted); font-size: 20px; }
.banner { background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn-fg); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.ws { display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, 44%); gap: 18px; align-items: start; }
.ws.nopreview { grid-template-columns: minmax(0, 1fr); }
.ws.nopreview .preview { display: none; }
.editor { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.preview { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 68px); height: calc(100vh - 92px); display: flex; flex-direction: column; min-width: 0; }
.preview .bar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.pages { flex: 1; overflow-y: auto; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.pages canvas { width: 100%; max-width: 640px; height: auto; background: #ffffff; box-shadow: 0 1px 4px rgba(0,0,0,.18); }

.ask { border-color: var(--accent-2); }
.ask .row { align-items: flex-start; flex-wrap: nowrap; }
.ask .hint { margin-top: 6px; }

.sec { overflow: hidden; }
.sec.is-hidden { opacity: .55; }
.sec-head { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--field-hover); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.sec-head .kind { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-2); width: 50px; flex: none; }
.sec-head .t { flex: 1; min-width: 140px; font-family: var(--display); font-weight: 600; font-variation-settings: "wdth" 112; font-size: 16px; border: 1px solid transparent; background: transparent; padding: 3px 6px; border-radius: 4px; }
.sec-head .t:hover, .sec-head .t:focus { background: var(--surface); border-color: var(--line); }
.sec.heading .sec-head { background: var(--mast); border-bottom: 0; }
.sec.heading .sec-head .t { color: var(--mast-fg); font-size: 18px; letter-spacing: .03em; }
.sec.heading .sec-head .t:focus { color: var(--fg); }
.sec.heading .sec-head .kind, .sec.heading .sec-head label, .sec.heading .sec-head .btn.ghost { color: rgba(255,255,255,.75); }
.sec.heading .sec-head .btn.ghost:hover { background: rgba(255,255,255,.12); color: #ffffff; }
.sec-head label { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.sec-body { padding: 8px 10px 10px; overflow-x: auto; }
.sec-body table { border-collapse: collapse; width: 100%; }
.sec-body td, .sec-body th { padding: 1px; }
.sec-body tbody tr:nth-child(odd) td { background: var(--field-hover); }
.cellin { width: 100%; border: 1px solid transparent; background: transparent; padding: 4px 6px; border-radius: 3px; font-family: var(--mono); font-size: 12.5px; }
.cellin:hover { border-color: var(--line); background: var(--surface); }
.cellin:focus { background: var(--surface); border-color: var(--accent-2); outline: none; }
td.lbl .cellin { font-family: var(--body); font-weight: 600; font-size: 12.5px; }
th .cellin { font-family: var(--display); font-weight: 600; font-variation-settings: "wdth" 112; color: var(--accent); text-align: center; font-size: 13px; }
td.c .cellin { text-align: center; min-width: 76px; }
td.hl .cellin { background: var(--hl); color: var(--hl-fg); }
td.x { width: 26px; }
.add { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.add .btn { font-size: 12px; padding: 4px 10px; }

.att { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.att:last-child { border-bottom: 0; }
